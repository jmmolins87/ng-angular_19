


<div class="wrap-content">
  <h1 class="text-4xl">Contador: {{ counterSignal() }}</h1>
  <div class="flex justify-between w-50 mt-5">
    <button
      (click)="increaseBy(1)"
      [disabled]="counterSignal() === 10"
      role="button"
      class="btn btn-primary">
      +1
    </button>
    <button
      (click)="reset()"
      [disabled]="counterSignal() === 0"
      role="button"
      class="btn btn-primary">
      Reset
    </button>
    <button
      (click)="increaseBy(-1)"
      [disabled]="counterSignal() === 0"
      role="button"
      class="btn btn-primary">
      -1
    </button>
  </div>
</div>
