


<div #map></div>


<section class="controls">
  <h2 class="text-2xl font-bold text-black">
    Zoom
    <small class="text-gray-500 font-normal">{{ zoom() | number:"1.0-0" }}</small>
  </h2>
  <input
    [value]="zoom()"
    (input)="zoom.set(+txtZoom.value)"
    #txtZoom
    type="range"
    min="1"
    max="19"
    class="range range-secondary mt-2" />
  <h2 class="text-xl font-bold text-black">Coordenadas:</h2>
  <pre class="text-sm text-gray-500 font-normal mt-2">
    {{ { latitude: coordinates().lat | number:'1.4-4', longitude: coordinates().lng | number:'1.4-4'} | json }}
  </pre>
</section>
