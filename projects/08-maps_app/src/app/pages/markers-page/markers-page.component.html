


<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>


<section class="h-[40vh] w-full sm:fixed sm:w-[260px] overflow-y-scroll sm:max-h-9/12 sm:backdrop-blur-lg border-2 rounded top-20 left-10 p-5">
  @if(markers().length > 0) {
    <h2 class="text-xl font-bold text-white sm:text-black">Marcadores</h2>
    <hr class="my-2" />
  }
  <div class="flex flex-col gap-2">
    @for(marker of markers(); track marker.id) {
      <button
        (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
        (dblclick)="deleteMarker(marker)"
        class="form-control text-start">
        <label for="" class="label cursor-pointer">
          <span class="label-text text-white text-lg sm:text-black sm:text-xs sm:whitespace-normal">
            {{ marker.mapboxMarker.getLngLat() }}
          </span>
          <input
            [style]="{backgroundColor: marker.mapboxMarker._color}"
            type="radio"
            name="radio-12"
            checked="checked"
            class="radio" />
        </label>
      </button>
    } @empty {
      <div class="flex justify-center items-center bg-blue-100 p-2 rounded">
        <p class="text-xl text-blue-400 mt-1">No hay marcadores</p>
      </div>
    }
  </div>
</section>
