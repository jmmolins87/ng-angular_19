

<section
  class="p-4"
  style="position: sticky; top: 0; background-color: rgba(255, 255, 255, .8); backdrop-filter: blur(1.5rem); width: 100%;">
  <h2 class="text-2xl font-bold">Buscar Gifs</h2>
  <h3 class="text-sm text-gray-500">Buscar por nombre, descripción o tag</h3>
  <input
    (keyup.enter)="searchGif(txtSearch.value)"
    #txtSearch
    type="text"
    placeholder="Buscar Gif"
    class="mt-3 border border-gray-300 rounded-md p-2 w-full" >
</section>

<section class="px-4 my-4">
  @if(gifs().length === 0) {
    <h2 class="text-3xl font-bold text-center text-slate-800 mt-10">No se buscaron gifs aún</h2>
  }
  @else {
    <gif-list [gifsUrls]="gifs()" />
  }
</section>
